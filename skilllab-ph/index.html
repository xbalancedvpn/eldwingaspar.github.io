<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>SkillLab PH</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--card:#101f33;--line:#28405e;--text:#f4f7fb;--muted:#91a7c0;--accent:#28d7a0;--accent2:#67e8f9;--danger:#ff8585;--warn:#f6c85f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#173b5e,transparent 34%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding:22px 0 56px}.top,.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brandline{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#032018;font-weight:950}.brand{font-size:26px;font-weight:900}.sub,.muted{color:var(--muted)}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.ok{color:#baffea}.bad{color:#ffb8b8}.warn{color:#ffe2a2}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn,.tabs button{min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:0 15px;font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#032018}.tabs button.on{border-color:var(--accent);color:#baffea;background:rgba(40,215,160,.08)}.btn:disabled{opacity:.5;cursor:not-allowed}.card{border:1px solid var(--line);background:rgba(16,31,51,.94);border-radius:17px;padding:18px}.hero{padding:24px}.hero h1{font-size:30px;line-height:1.08;margin:6px 0 8px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.metric b{font-size:23px;display:block;margin:5px 0}.hidden{display:none!important}.form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:12px;font-weight:700}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#081421;color:var(--text);padding:0 12px;font-size:16px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:11px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase}.scene{display:flex;justify-content:center;align-items:center;gap:42px;min-height:245px;border-radius:14px;background:radial-gradient(circle at 50% 0,#1b3859,#081421 65%);margin:13px 0}.screen{width:215px;height:128px;border:9px solid #18212b;background:#020508;display:grid;place-items:center;color:#71849b;border-radius:8px}.screen.fixed{background:#0f5a50;color:#d7fff5}.tower{width:104px;height:195px;border:1px solid #4c6179;border-radius:11px;display:grid;place-items:center;font-size:42px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts button{min-height:44px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:9px;cursor:pointer}.acts button.used{border-color:#2d846e;color:#baffea}.log{margin-top:12px;padding:12px;background:#081421;border-radius:11px}.log p{margin:6px 0;color:var(--muted);font-size:12px}.score{font-size:42px;font-weight:900;color:#baffea}.pill{display:inline-block;border:1px solid #2d846e;background:rgba(40,215,160,.08);color:#baffea;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.progress{height:8px;background:#081421;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.spin{display:inline-block;width:15px;height:15px;border:2px solid #58718d;border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin-right:7px;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:760px){.g2,.g4{grid-template-columns:1fr}.scene{gap:16px}.screen{width:155px;height:96px}.tower{width:76px;height:145px}.hero h1{font-size:25px}}@media(max-width:500px){.acts{grid-template-columns:1fr}.brand{font-size:22px}.wrap{width:min(100% - 18px,1120px)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brandline"><div class="logo">SL</div><div><div class="ey ok">● LIVE CLASSROOM MVP</div><div class="brand">SkillLab PH</div><div class="sub">Virtual skills laboratory for Computer Systems Servicing</div></div></div><div class="sub">MVP → Classroom Pilot</div></header>
<nav class="tabs"><button class="on" data-tab="founder">Founder HQ</button><button data-tab="teacher">Teacher Dashboard</button><button data-tab="student">Student Lab</button></nav>
<main><section id="founder"></section><section id="teacher" class="hidden"></section><section id="student" class="hidden"></section></main>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const SUPABASE_URL='https://pejqnbqxfodjlmgtdnxh.supabase.co';
const SUPABASE_KEY='sb_publishable_n6E-3o4y6-fN7HGk85sPWw_HJc7Kl08';
const API='https://pejqnbqxfodjlmgtdnxh.supabase.co/functions/v1/skilllab-app';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async body=>{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let data={};try{data=await r.json()}catch{}if(!r.ok&&!data.error)data.error='Request failed.';return data};
let teacher=null,classes=[],attempts=[],selectedClassId=null;
let sess=null,studentName='',studentCode='',seen=[],logs=[],diag='',repair='',result=null;
const F=document.querySelector('#founder'),T=document.querySelector('#teacher'),S=document.querySelector('#student');

document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==btn.dataset.tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===btn));if(btn.dataset.tab==='teacher')renderTeacher();if(btn.dataset.tab==='student')renderStudent()});

function founder(){F.innerHTML=`<div class="grid"><article class="card hero"><div class="ey">FOUNDER OPERATING CONSOLE</div><h1>SkillLab PH is running as a cloud classroom MVP.</h1><p class="muted">We are validating one clear promise first: students can practice CSS troubleshooting virtually while teachers get competency evidence, not just quiz scores.</p><div class="progress"><span style="width:48%"></span></div><p class="muted">Current stage: working MVP → real classroom pilot</p></article><div class="grid g4"><div class="card metric"><span class="muted">Frontend</span><b>Public</b><span class="muted">GitHub Pages</span></div><div class="card metric"><span class="muted">Backend</span><b>Connected</b><span class="muted">Supabase</span></div><div class="card metric"><span class="muted">Simulator</span><b>001</b><span class="muted">No-display troubleshooting</span></div><div class="card metric"><span class="muted">Next</span><b>Pilot</b><span class="muted">Real CSS students</span></div></div><article class="card"><div class="ey">EXECUTION QUEUE</div><p>✓ Product foundation &nbsp; ✓ Database &nbsp; ✓ Teacher auth &nbsp; ✓ Class codes &nbsp; ✓ Server-side scoring &nbsp; ✓ Public frontend</p><p class="muted">Next: real student attempts → pilot analytics → classroom UX fixes → Simulator 002.</p></article></div>`}

async function renderTeacher(){T.innerHTML='<div class="card"><span class="spin"></span>Loading teacher workspace…</div>';const{data:{session}}=await sb.auth.getSession();teacher=session?.user||null;if(!teacher){T.innerHTML=`<div class="grid g2"><article class="card hero"><div class="ey">TEACHER ACCOUNT</div><h1>Run your first SkillLab class.</h1><p class="muted">Create an account or sign in. Your classes and student results are stored in the cloud.</p></article><form id="auth" class="card form"><label>Email<input id="em" type="email" autocomplete="email" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" minlength="6" required></label><div class="row"><button class="btn primary" id="login">Sign in</button><button class="btn" type="button" id="signup">Create account</button></div><div id="authmsg" class="muted"></div></form></div>`;const go=async mode=>{const em=document.querySelector('#em').value.trim(),pw=document.querySelector('#pw').value,m=document.querySelector('#authmsg');if(!em||pw.length<6){m.innerHTML='<span class="bad">Enter a valid email and password of at least 6 characters.</span>';return}m.innerHTML='<span class="spin"></span>Working…';const x=mode==='login'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});if(x.error){m.innerHTML='<span class="bad">'+esc(x.error.message)+'</span>';return}if(mode==='signup'&&!x.data.session){m.innerHTML='<span class="ok">Account created. Confirm your email if prompted, then sign in.</span>';return}renderTeacher()};document.querySelector('#auth').onsubmit=e=>{e.preventDefault();go('login')};document.querySelector('#signup').onclick=()=>go('signup');return}
const c=await sb.from('classes').select('id,name,code,created_at,is_active').order('created_at',{ascending:false});if(c.error){T.innerHTML='<div class="card bad">Could not load classes: '+esc(c.error.message)+'</div>';return}classes=c.data||[];if(!selectedClassId&&classes[0])selectedClassId=classes[0].id;const cur=classes.find(x=>x.id===selectedClassId)||classes[0]||null;attempts=[];if(cur){const a=await sb.from('attempts').select('student_name,score,mastery,efficiency,diagnosis_key,created_at').eq('class_id',cur.id).order('created_at',{ascending:false}).limit(250);attempts=a.data||[]}const avg=attempts.length?Math.round(attempts.reduce((q,x)=>q+x.score,0)/attempts.length):0;const mastered=attempts.filter(x=>x.mastery==='Mastered').length;const developing=attempts.filter(x=>x.mastery==='Developing'||x.mastery==='Needs Support').length;
T.innerHTML=`<div class="grid"><div class="row"><div><div class="ey">TEACHER WORKSPACE</div><h2>${cur?esc(cur.name):'Create your first class'}</h2><div class="muted">${esc(teacher.email)}</div></div><div><button class="btn" id="refresh">Refresh</button> <button class="btn" id="newclass">New class</button> <button class="btn" id="logout">Sign out</button></div></div><div id="classform"></div>${classes.length>1?`<article class="card form"><label>Active class<select id="classpick">${classes.map(x=>`<option value="${x.id}" ${x.id===cur?.id?'selected':''}>${esc(x.name)} — ${esc(x.code)}</option>`).join('')}</select></label></article>`:''}${cur?`<div class="grid g4"><div class="card metric"><span class="muted">Class code</span><b>${esc(cur.code)}</b><span class="muted">Share with students</span></div><div class="card metric"><span class="muted">Attempts</span><b>${attempts.length}</b><span class="muted">Cloud submissions</span></div><div class="card metric"><span class="muted">Average</span><b>${avg}%</b><span class="muted">Current class</span></div><div class="card metric"><span class="muted">Need support</span><b>${developing}</b><span class="muted">Developing / support</span></div></div><article class="card"><div class="ey">TEACHING INSIGHT</div><h3>${attempts.length?'Class evidence is accumulating.':'Waiting for first real attempts.'}</h3><p class="muted">${attempts.length?`${mastered} attempt(s) reached Mastered. ${developing} attempt(s) currently need reinforcement. Efficiency helps identify students who reach answers through too much random checking.`:'Share the class code with students and ask them to complete Simulator 001. Their results will appear here.'}</p></article><article class="card table"><div class="ey">STUDENT RESULTS</div><table><thead><tr><th>Student</th><th>Score</th><th>Mastery</th><th>Efficiency</th><th>Submitted</th></tr></thead><tbody>${attempts.length?attempts.map(x=>`<tr><td><b>${esc(x.student_name)}</b></td><td>${x.score}</td><td>${esc(x.mastery)}</td><td>${x.efficiency}%</td><td>${new Date(x.created_at).toLocaleString('en-PH')}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No student attempts yet.</td></tr>'}</tbody></table></article>`:`<article class="card"><h3>Create your first class</h3><p class="muted">Students join with a class code. No student account is required for this MVP.</p></article>`}</div>`;
const showForm=()=>{document.querySelector('#classform').innerHTML=`<form id="mk" class="card form"><label>Class name<input id="cn" value="Grade 12 - Computer Systems Servicing" required></label><label>Class code<input id="cc" value="CSS101" maxlength="8" required></label><div id="cm" class="muted"></div><button class="btn primary">Save class</button></form>`;document.querySelector('#mk').onsubmit=async e=>{e.preventDefault();const name=document.querySelector('#cn').value.trim(),code=document.querySelector('#cc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(name.length<2||code.length<4){document.querySelector('#cm').innerHTML='<span class="bad">Use a class name and a 4–8 character code.</span>';return}const x=await sb.from('classes').insert({owner_id:teacher.id,name,code}).select('id').single();if(x.error){document.querySelector('#cm').innerHTML='<span class="bad">'+esc(x.error.message)+'</span>';return}selectedClassId=x.data.id;renderTeacher()}};document.querySelector('#newclass').onclick=showForm;document.querySelector('#refresh').onclick=()=>renderTeacher();document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();selectedClassId=null;renderTeacher()};const pick=document.querySelector('#classpick');if(pick)pick.onchange=e=>{selectedClassId=e.target.value;renderTeacher()}}

async function startAttempt(name,code){const x=await api({action:'join',student_name:name,class_code:code});if(x.error)return x;sess=x;studentName=name;studentCode=code;seen=[];logs=['System powers on, fans are spinning, monitor reports no signal.'];diag='';repair='';result=null;return x}
function renderStudent(){if(!sess){S.innerHTML=`<div class="grid g2"><article class="card hero"><div class="ey">STUDENT LAB</div><h1>Practice the skill, not just the question.</h1><p class="muted">Enter your name and your teacher's class code. SkillLab will generate a troubleshooting case and save your result automatically.</p><span class="pill">Simulator 001 · PC Powers On but No Display</span></article><form id="join" class="card form"><label>Student name<input id="sn" maxlength="80" required></label><label>Class code<input id="sc" maxlength="8" required></label><div id="joinmsg" class="muted"></div><button class="btn primary">Start activity</button></form></div>`;document.querySelector('#join').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#joinmsg'),name=document.querySelector('#sn').value.trim(),code=document.querySelector('#sc').value.trim().toUpperCase();m.innerHTML='<span class="spin"></span>Starting…';const x=await startAttempt(name,code);if(x.error){m.innerHTML='<span class="bad">'+esc(x.error)+'</span>';return}renderStudent()};return}
const eff=Math.max(55,100-Math.max(0,seen.length-2)*8);S.innerHTML=`<div class="grid"><div class="row"><div><div class="ey">SIMULATOR 001</div><h2>PC Powers On but No Display</h2><div class="muted">${esc(sess.class_name)}</div></div><button class="btn" id="exitlab">Exit</button></div><div class="grid g2"><article class="card"><div class="row"><b>Virtual Workbench</b><span>Efficiency <b>${eff}%</b></span></div><div class="scene"><div class="screen ${result&&result.score>=80?'fixed':''}">${result&&result.score>=80?'DISPLAY RESTORED':'NO SIGNAL'}</div><div class="tower">◉</div></div><h3>Diagnostic actions</h3><div class="acts">${[['monitor','Inspect monitor/input'],['cable','Inspect display cable'],['post','Check POST symptoms'],['ram','Inspect RAM seating'],['gpu','Inspect GPU connection'],['power','Power cycle system']].map(x=>`<button data-act="${x[0]}" class="${seen.includes(x[0])?'used':''}" ${seen.includes(x[0])||result?'disabled':''}>${seen.includes(x[0])?'✓ ':''}${x[1]}</button>`).join('')}</div><div class="log"><div class="ey">OBSERVATION LOG</div>${logs.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}</div></article><aside class="grid"><article class="card form"><label>Diagnosis<select id="dg" ${result?'disabled':''}><option value="">Select diagnosis</option><option value="monitor">Incorrect monitor input</option><option value="cable">Loose display cable</option><option value="ram">Improperly seated RAM</option><option value="gpu">GPU power/connection fault</option></select></label><label>Repair<select id="rp" ${result?'disabled':''}><option value="">Select repair</option><option value="monitor">Select correct monitor input</option><option value="cable">Reconnect display cable securely</option><option value="ram">Reseat RAM correctly</option><option value="gpu">Reconnect GPU power / reseat GPU</option></select></label>${!result?'<button class="btn primary" id="submitcase">Complete troubleshooting</button>':''}</article>${result?`<article class="card"><div class="ey ok">RESULT SAVED</div><div class="score">${result.score}/100</div><h3>${esc(result.mastery)}</h3><p>Actual fault: <b>${esc(result.actual_fault)}</b></p><p class="muted">Recommended repair: ${esc(result.repair)}<br>Diagnostic efficiency: ${result.efficiency}%</p><button class="btn" id="again">New attempt</button></article>`:''}</aside></div></div>`;document.querySelector('#dg').value=diag;document.querySelector('#rp').value=repair;document.querySelector('#dg').onchange=e=>diag=e.target.value;document.querySelector('#rp').onchange=e=>repair=e.target.value;document.querySelector('#exitlab').onclick=()=>{sess=null;seen=[];logs=[];result=null;renderStudent()};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const k=b.dataset.act;if(seen.includes(k))return;b.disabled=true;const x=await api({action:'inspect',session_id:sess.session_id,inspect:k});if(x.error){alert(x.error);return}seen.push(k);logs.push(x.clue);renderStudent()});const sub=document.querySelector('#submitcase');if(sub)sub.onclick=async()=>{if(!diag||!repair){alert('Choose a diagnosis and repair.');return}sub.disabled=true;sub.innerHTML='<span class="spin"></span>Saving…';const x=await api({action:'submit',session_id:sess.session_id,diagnosis:diag,repair});if(x.error){alert(x.error);sub.disabled=false;sub.textContent='Complete troubleshooting';return}result=x;renderStudent()};const ag=document.querySelector('#again');if(ag)ag.onclick=async()=>{const x=await startAttempt(studentName,studentCode);if(x.error){alert(x.error);sess=null;renderStudent();return}renderStudent()}}

sb.auth.onAuthStateChange(()=>{if(!T.classList.contains('hidden'))renderTeacher()});
founder();renderStudent();
</script>
</body>
</html>
