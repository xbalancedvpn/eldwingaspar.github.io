function courseCards(){const done=new Set(studentProgress?.completed||[]),next=studentProgress?.next_slug;return catalog.map((a,i)=>{const isDone=done.has(a.slug),isCurrent=a.slug===next;return`<div class="activity-card ${isDone?'done':isCurrent?'current':'locked'}"><div class="row"><div class="ey">SIMULATOR ${String(i+1).padStart(3,'0')}</div><b>${isDone?'✓ DONE':isCurrent?'NEXT':'LOCKED'}</b></div><h3>${esc(a.title)}</h3><small>${esc(a.competency)}</small></div>`}).join('')}

if(!name||!code){S.innerHTML=`<div class="grid"><article class="card hero"><div class="ey">STUDENT COURSE</div><h1>Start with Simulator 001 and continue at your own pace.</h1><p class="muted">After each simulator you can continue to the next one or take a break. Your progress is saved automatically. To resume later, enter the same full name and class code.</p></article><form id="resume" class="card form"><label>Student full name<input id="sn" maxlength="80" required></label><label>Class code<input id="sc" maxlength="8" required></label><div id="rm" class="muted"></div><button class="btn primary">Start / Resume my course</button></form><div class="activity-grid">${catalog.map((a,i)=>`<div class="activity-card ${i?'locked':'current'}"><div class="ey">SIMULATOR ${String(i+1).padStart(3,'0')}</div><h3>${esc(a.title)}</h3><small>${i?'Complete the previous simulator to unlock':'Starts here'}</small></div>`).join('')}</div></div>`;document.querySelector('#resume').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#rm');name=document.querySelector('#sn').value.trim().replace(/\s+/g,' ');code=document.querySelector('#sc').value.trim().toUpperCase();m.innerHTML='<span class="spin"></span>Checking saved progress…';const p=await refreshStudentProgress();if(p.error){name='';code='';m.innerHTML='<span class="bad">'+esc(p.error)+'</span>';return}if(p.finished_all){breakMode=true;renderStudent();return}selected=p.next_slug;const x=await start(name,code,selected);if(x.error){m.innerHTML='<span class="bad">'+esc(x.error)+'</span>';return}renderStudent()};return}
if(breakMode&&!sess){if(!studentProgress||studentProgress.error)await refreshStudentProgress();if(studentProgress?.finished_all){S.innerHTML=`<div class="grid"><article class="card hero"><div class="ey ok">COURSE COMPLETE</div><h1>Great work, ${esc(name)}.</h1><p>You completed all 10 SkillLab CSS simulators.</p><div class="progress"><span style="width:100%"></span></div><p class="ok"><b>10/10 complete</b></p></article><article class="card"><button class="btn" id="leave">Finish session</button></article></div>`;document.querySelector('#leave').onclick=()=>{name='';code='';studentProgress=null;breakMode=false;renderStudent()};return}const next=catalog.find(a=>a.slug===studentProgress?.next_slug),pct=Math.round((studentProgress?.completed_count||0)/10*100);S.innerHTML=`<div class="grid"><article class="card hero"><div class="ey ok">PROGRESS SAVED</div><h1>Take your break.</h1><p class="muted">You can close SkillLab now. When you return, use the same name and class code and you will continue at the next unfinished simulator.</p><div class="progress"><span style="width:${pct}%"></span></div><p><b>${studentProgress?.completed_count||0}/10 complete</b></p></article><article class="card"><div class="ey">NEXT WHEN YOU ARE READY</div><h3>${esc(next?.title||'Next simulator')}</h3><div class="row"><button class="btn primary" id="resumeNow">Continue now</button><button class="btn" id="endNow">End session</button></div></article><div class="activity-grid">${courseCards()}</div></div>`;document.querySelector('#resumeNow').onclick=async()=>{selected=studentProgress.next_slug;const x=await start(name,code,selected);if(x.error)return alert(x.error);renderStudent()};document.querySelector('#endNow').onclick=()=>{name='';code='';studentProgress=null;breakMode=false;renderStudent()};return}
const eff=Math.max(55,100-Math.max(0,seen.length-2)*8),actions=sess.actions||[],opts=sess.options||[],idx=Math.max(0,catalog.findIndex(a=>a.slug===selected));S.innerHTML=`<div class="grid"><article class="card"><div class="row"><div><div class="ey">COURSE PROGRESS</div><b>Simulator ${String(idx+1).padStart(3,'0')} of 010</b></div><div class="coursebar">${catalog.map((a,i)=>`<span class="${i<idx?'done':i===idx?'current':'locked'}">${i+1}</span>`).join('')}</div></div></article><div class="row"><div><div class="ey">ACTIVE SIMULATOR</div><h2>${esc(sess.activity_title)}</h2><div class="muted">${esc(sess.class_name)}</div></div><button class="btn" id="exit">Take a break</button></div><div class="grid g2"><article class="card"><div class="row"><b>Virtual Workbench</b><span>Efficiency <b>${eff}%</b></span></div><div class="scene"><div class="screen ${result&&result.score>=80?'fixed':''}">${result&&result.score>=80?'ISSUE RESOLVED':esc(sess.status_text||'SYSTEM FAULT')}</div><div class="tower">◉</div></div><div class="notice">${esc(sess.intro)}</div><h3>Diagnostic actions</h3><div class="acts">${actions.map(x=>`<button data-act="${x[0]}" class="${seen.includes(x[0])?'used':''}" ${seen.includes(x[0])||result?'disabled':''}>${seen.includes(x[0])?'✓ ':''}${esc(x[1])}</button>`).join('')}</div><div class="log"><div class="ey">OBSERVATION LOG</div>${logs.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}</div></article><aside class="grid"><article class="card form"><label>Diagnosis<select id="dg" ${result?'disabled':''}><option value="">Select diagnosis</option>${opts.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label><label>Repair<select id="rp" ${result?'disabled':''}><option value="">Select repair</option>${opts.map(x=>`<option value="${x[0]}">${esc(x[2])}</option>`).join('')}</select></label>${result?'':'<button class="btn primary" id="submit">Complete troubleshooting</button>'}</article>${result?`<article class="card"><div class="ey ok">SIMULATOR COMPLETE</div><div class="score">${result.score}/100</div><h3>${esc(result.mastery)}</h3><p>Actual fault: <b>${esc(result.actual_fault)}</b></p><p class="muted">Repair: ${esc(result.repair)}<br>Efficiency: ${result.efficiency}%<br>Time: ${fmt(result.duration_seconds)}</p><div class="row"><button class="btn primary" id="continueNext">${idx===catalog.length-1?'Finish course':'Continue to next simulator'}</button><button class="btn" id="breakNow">Take a break</button></div></article>${feedbackDone?'<article class="card"><div class="ey ok">FEEDBACK SAVED</div><p class="muted">Thank you. You can continue or take a break.</p></article>':`<article class="card form"><div class="ey">10-SECOND FEEDBACK</div><h3>How clear was this activity?</h3><div class="feedback-buttons"><button type="button" class="btn" data-f="clear">Clear</button><button type="button" class="btn" data-f="somewhat_confusing">Somewhat confusing</button><button type="button" class="btn" data-f="confusing">Confusing</button></div><label>Optional note<textarea id="note" maxlength="500"></textarea></label><div id="fm" class="muted"></div></article>`}`:''}</aside></div></div>`;
document.querySelector('#dg').value=diag;document.querySelector('#rp').value=repair;document.querySelector('#dg').onchange=e=>diag=e.target.value;document.querySelector('#rp').onchange=e=>repair=e.target.value;document.querySelector('#exit').onclick=async()=>{if(result){studentProgress=await refreshStudentProgress();sess=null;breakMode=true;renderStudent();return}if(confirm('This simulator is not completed yet. Leave now and restart it later?')){sess=null;breakMode=true;studentProgress=await refreshStudentProgress();renderStudent()}};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const x=await api({action:'inspect',session_id:sess.session_id,inspect:b.dataset.act});if(x.error)return alert(x.error);if(!seen.includes(b.dataset.act))seen.push(b.dataset.act);logs.push(x.clue);renderStudent()});const sub=document.querySelector('#submit');if(sub)sub.onclick=async()=>{if(!diag||!repair)return alert('Choose a diagnosis and repair.');const x=await api({action:'submit',session_id:sess.session_id,diagnosis:diag,repair});if(x.error)return alert(x.error);result=x;studentProgress=await refreshStudentProgress();renderStudent()};const cont=document.querySelector('#continueNext');if(cont)cont.onclick=async()=>{studentProgress=await refreshStudentProgress();if(studentProgress.error)return alert(studentProgress.error);if(studentProgress.finished_all){sess=null;breakMode=true;renderStudent();return}selected=studentProgress.next_slug;const x=await start(name,code,selected);if(x.error)return alert(x.error);renderStudent()};const br=document.querySelector('#breakNow');if(br)br.onclick=async()=>{studentProgress=await refreshStudentProgress();sess=null;breakMode=true;renderStudent()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const m=document.querySelector('#fm');m.innerHTML='<span class="spin"></span>Saving…';const x=await api({action:'feedback',attempt_id:result.attempt_id,clarity:b.dataset.f,note:document.querySelector('#note')?.value||''});if(x.error){m.innerHTML='<span class="bad">'+esc(x.error)+'</span>';return}feedbackDone=true;renderStudent()})}
sb.auth.onAuthStateChange(()=>{if(!T.classList.contains('hidden'))renderTeacher()});await loadCatalog();founder();renderStudent();
</script></body></html>
