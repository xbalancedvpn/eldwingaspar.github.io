<style>
:root{--bg:#07111f;--panel:#0d1a2b;--card:#101f33;--line:#28405e;--text:#f4f7fb;--muted:#91a7c0;--accent:#28d7a0;--accent2:#67e8f9;--danger:#ff8585;--warn:#f6c85f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#173b5e,transparent 34%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1160px,calc(100% - 24px));margin:auto;padding:22px 0 56px}.top,.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brandline{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#032018;font-weight:950}.brand{font-size:26px;font-weight:900}.sub,.muted{color:var(--muted)}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.ok{color:#baffea}.bad{color:#ffb8b8}.warn{color:#ffe2a2}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn,.tabs button{min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:0 15px;font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#032018}.btn.danger{border-color:#754a54;color:#ffb8b8}.tabs button.on{border-color:var(--accent);color:#baffea;background:rgba(40,215,160,.08)}.btn:disabled{opacity:.5;cursor:not-allowed}.card{border:1px solid var(--line);background:rgba(16,31,51,.94);border-radius:17px;padding:18px}.hero{padding:24px}.hero h1{font-size:30px;line-height:1.08;margin:6px 0 8px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.metric b{font-size:23px;display:block;margin:5px 0}.hidden{display:none!important}.form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:12px;font-weight:700}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#081421;color:var(--text);padding:0 12px;font-size:16px}textarea{min-height:82px;padding:10px 12px;resize:vertical}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:11px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase}.scene{display:flex;justify-content:center;align-items:center;gap:42px;min-height:245px;border-radius:14px;background:radial-gradient(circle at 50% 0,#1b3859,#081421 65%);margin:13px 0}.screen{width:215px;height:128px;border:9px solid #18212b;background:#020508;display:grid;place-items:center;text-align:center;padding:10px;color:#71849b;border-radius:8px}.screen.fixed{background:#0f5a50;color:#d7fff5}.tower{width:104px;height:195px;border:1px solid #4c6179;border-radius:11px;display:grid;place-items:center;font-size:42px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts button{min-height:44px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:9px;cursor:pointer}.acts button.used{border-color:#2d846e;color:#baffea}.log{margin-top:12px;padding:12px;background:#081421;border-radius:11px}.log p{margin:6px 0;color:var(--muted);font-size:12px}.score{font-size:42px;font-weight:900;color:#baffea}.pill{display:inline-block;border:1px solid #2d846e;background:rgba(40,215,160,.08);color:#baffea;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.pill.paused{border-color:#7b5660;background:rgba(255,133,133,.08);color:#ffc2c2}.progress{height:8px;background:#081421;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.spin{display:inline-block;width:15px;height:15px;border:2px solid #58718d;border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin-right:7px;vertical-align:-3px}.activity-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#0b1727;cursor:pointer}.activity-card:hover,.activity-card.selected{border-color:var(--accent);background:rgba(40,215,160,.07)}.activity-card h3{margin:5px 0 6px}.activity-card p{margin:0 0 8px}.activity-card small{color:var(--muted)}.breakdown{border-left:3px solid var(--accent)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{width:auto;min-width:190px}.notice{border:1px solid #4e6d8f;background:#0a1727;border-radius:12px;padding:11px 13px}.empty{padding:26px;text-align:center;color:var(--muted)}.feedback-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status-ok{color:#baffea;font-weight:800}.status-pending{color:#ffe2a2;font-weight:800}.mini-progress{height:7px;border-radius:999px;background:#081421;overflow:hidden}.mini-progress span{display:block;height:100%;background:var(--accent)}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}.scene{gap:16px}.screen{width:155px;height:96px}.tower{width:76px;height:145px}.hero h1{font-size:25px}.toolbar select{width:100%}.feedback-buttons{grid-template-columns:1fr}}@media(max-width:500px){.acts{grid-template-columns:1fr}.brand{font-size:22px}.wrap{width:min(100% - 18px,1160px)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brandline"><div class="logo">SL</div><div><div class="ey ok">● PILOT-READY MVP</div><div class="brand">SkillLab PH</div><div class="sub">Virtual skills laboratory for Computer Systems Servicing</div></div></div><div class="sub">MVP complete → Classroom validation</div></header>
<nav class="tabs"><button class="on" data-tab="founder">Founder HQ</button><button data-tab="teacher">Teacher Dashboard</button><button data-tab="student">Student Lab</button></nav>
<main><section id="founder"></section><section id="teacher" class="hidden"></section><section id="student" class="hidden"></section></main>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const SUPABASE_URL='https://pejqnbqxfodjlmgtdnxh.supabase.co';
const SUPABASE_KEY='sb_publishable_n6E-3o4y6-fN7HGk85sPWw_HJc7Kl08';
const API='https://pejqnbqxfodjlmgtdnxh.supabase.co/functions/v1/skilllab-app';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async body=>{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let data={};try{data=await r.json()}catch{}if(!r.ok&&!data.error)data.error='Request failed.';return data};
const csvCell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};
const fmtDuration=s=>{if(s===null||s===undefined||Number.isNaN(Number(s)))return '—';s=Number(s);return s<60?`${s}s`:`${Math.floor(s/60)}m ${s%60}s`};
const studentKey=x=>String(x.student_name||'').trim().toLowerCase();
const keyOf=x=>`${studentKey(x)}|${x.activities?.slug||''}`;
const viewRows=(rows,view)=>{if(view==='all')return rows;const groups=new Map();rows.forEach(r=>{const k=keyOf(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});return[...groups.values()].map(g=>{const sorted=[...g].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));if(view==='first')return sorted[0];if(view==='best')return[...g].sort((a,b)=>(b.score-a.score)||(b.efficiency-a.efficiency)||(new Date(b.created_at)-new Date(a.created_at)))[0];return sorted[sorted.length-1]}).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))};
const growthStats=rows=>{const groups=new Map();rows.forEach(r=>{const k=keyOf(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});const changes=[...groups.values()].map(g=>{const s=[...g].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)),first=s[0],last=s[s.length-1];return{score:last.score-first.score,eff:last.efficiency-first.efficiency,steps:(first.steps_count??0)-(last.steps_count??0)}});const n=changes.length||1;return{pairs:changes.length,improved:changes.filter(x=>x.score>0||x.eff>0||x.steps>0).length,score:changes.length?changes.reduce((q,x)=>q+x.score,0)/n:0,eff:changes.length?changes.reduce((q,x)=>q+x.eff,0)/n:0,steps:changes.length?changes.reduce((q,x)=>q+x.steps,0)/n:0}};
let teacher=null,classes=[],attempts=[],feedback=[],selectedClassId=null,teacherActivityFilter='all',teacherAttemptView='latest';
let catalog=[],selectedActivitySlug='pc-no-display-001';
let sess=null,studentName='',studentCode='',seen=[],logs=[],diag='',repair='',result=null,feedbackDone=false;
const F=document.querySelector('#founder'),T=document.querySelector('#teacher'),S=document.querySelector('#student');

async function ensureCatalog(){if(catalog.length)return catalog;const x=await api({action:'catalog'});catalog=x.activities||[];if(!catalog.find(a=>a.slug===selectedActivitySlug)&&catalog[0])selectedActivitySlug=catalog[0].slug;return catalog}
function setTab(tab){document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));if(tab==='teacher')renderTeacher();if(tab==='student')renderStudent()}
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>setTab(btn.dataset.tab));

function founder(){F.innerHTML=`<div class="grid"><article class="card hero"><div class="ey ok">PILOT-READY MVP MILESTONE</div><h1>The SkillLab PH classroom-pilot build is complete.</h1><p class="muted">Teacher class management, no-account student joining, two randomized CSS simulators, hidden server scoring, retry-aware analytics, time-on-task, full-completion tracking, feedback capture, and pilot evidence export are all in place.</p><div class="progress"><span style="width:100%"></span></div><p class="ok"><b>100% of the pilot-ready MVP software milestone is complete.</b></p></article><div class="grid g4"><div class="card metric"><span class="muted">Frontend</span><b>Public</b><span class="muted">GitHub Pages</span></div><div class="card metric"><span class="muted">Backend</span><b>v0.3</b><span class="muted">Secure scoring + feedback</span></div><div class="card metric"><span class="muted">Simulators</span><b>2</b><span class="muted">Active CSS labs</span></div><div class="card metric"><span class="muted">MVP stage</span><b>Ready</b><span class="muted">Classroom validation next</span></div></div><article class="card"><div class="ey">COMPLETED SCOPE</div><p>✓ Public hosting &nbsp; ✓ Teacher auth &nbsp; ✓ Class controls &nbsp; ✓ Secure scoring &nbsp; ✓ Randomized scenarios &nbsp; ✓ 2 CSS simulators &nbsp; ✓ 3-student dry run &nbsp; ✓ Duration tracking &nbsp; ✓ First/latest/best/all views &nbsp; ✓ Participation vs completion &nbsp; ✓ Learning-change analytics &nbsp; ✓ Student clarity feedback &nbsp; ✓ Pilot evidence report</p><p class="muted">The remaining step is not more MVP coding: it is real classroom validation with the target class.</p></article></div>`}

async function renderTeacher(){
  T.innerHTML='<div class="card"><span class="spin"></span>Loading teacher workspace…</div>';
  await ensureCatalog();
  const{data:{session}}=await sb.auth.getSession();teacher=session?.user||null;
  if(!teacher){T.innerHTML=`<div class="grid g2"><article class="card hero"><div class="ey">TEACHER ACCOUNT</div><h1>Run your SkillLab class.</h1><p class="muted">Create an account or sign in. Your classes and student results are stored in the cloud.</p></article><form id="auth" class="card form"><label>Email<input id="em" type="email" autocomplete="email" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" minlength="6" required></label><div class="row"><button class="btn primary" id="login">Sign in</button><button class="btn" type="button" id="signup">Create account</button></div><div id="authmsg" class="muted"></div></form></div>`;const go=async mode=>{const em=document.querySelector('#em').value.trim(),pw=document.querySelector('#pw').value,m=document.querySelector('#authmsg');if(!em||pw.length<6){m.innerHTML='<span class="bad">Enter a valid email and password of at least 6 characters.</span>';return}m.innerHTML='<span class="spin"></span>Working…';const x=mode==='login'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});if(x.error){m.innerHTML='<span class="bad">'+esc(x.error.message)+'</span>';return}if(mode==='signup'&&!x.data.session){m.innerHTML='<span class="ok">Account created. Confirm your email if prompted, then sign in.</span>';return}renderTeacher()};document.querySelector('#auth').onsubmit=e=>{e.preventDefault();go('login')};document.querySelector('#signup').onclick=()=>go('signup');return}

  const c=await sb.from('classes').select('id,name,code,created_at,is_active,expected_students').order('created_at',{ascending:false});
  if(c.error){T.innerHTML='<div class="card bad">Could not load classes: '+esc(c.error.message)+'</div>';return}
  classes=c.data||[];if(!selectedClassId&&classes[0])selectedClassId=classes[0].id;const cur=classes.find(x=>x.id===selectedClassId)||classes[0]||null;
  attempts=[];feedback=[];
  if(cur){
    const a=await sb.from('attempts').select('student_name,score,mastery,efficiency,steps_count,duration_seconds,created_at,activities(title,slug)').eq('class_id',cur.id).order('created_at',{ascending:false}).limit(500);attempts=a.data||[];
    const f=await sb.from('pilot_feedback').select('student_name,clarity,note,created_at,activities(title,slug)').eq('class_id',cur.id).order('created_at',{ascending:false}).limit(500);feedback=f.data||[];
  }
  const activityRows=teacherActivityFilter==='all'?attempts:attempts.filter(x=>x.activities?.slug===teacherActivityFilter);
  const visible=viewRows(activityRows,teacherAttemptView);
  const expected=cur?.expected_students||15;
  const participants=new Set(attempts.map(studentKey).filter(Boolean));
  const activeSlugs=catalog.map(a=>a.slug);
  const byStudent=new Map(),displayNames=new Map();attempts.forEach(x=>{const k=studentKey(x);if(!k)return;if(!byStudent.has(k))byStudent.set(k,new Set());if(!displayNames.has(k))displayNames.set(k,x.student_name);if(x.activities?.slug)byStudent.get(k).add(x.activities.slug)});
  const roster=[...byStudent.entries()].map(([key,set])=>({key,name:displayNames.get(key)||key,done:set.size,complete:activeSlugs.length>0&&activeSlugs.every(slug=>set.has(slug)),slugs:set})).sort((a,b)=>a.name.localeCompare(b.name));
  const fullCompleters=roster.filter(x=>x.complete).length;
  const participationRate=Math.min(100,Math.round(participants.size/expected*100));
  const fullCompletionRate=Math.min(100,Math.round(fullCompleters/expected*100));
  const uniqueStudents=new Set(activityRows.map(studentKey).filter(Boolean)).size;
  const avg=visible.length?Math.round(visible.reduce((q,x)=>q+x.score,0)/visible.length):0;
  const eff=visible.length?Math.round(visible.reduce((q,x)=>q+x.efficiency,0)/visible.length):0;
  const durations=visible.filter(x=>x.duration_seconds!==null&&x.duration_seconds!==undefined);
  const avgDuration=durations.length?Math.round(durations.reduce((q,x)=>q+Number(x.duration_seconds),0)/durations.length):null;
  const mastered=visible.filter(x=>x.mastery==='Mastered').length;
  const support=visible.filter(x=>x.mastery==='Developing'||x.mastery==='Needs Support').length;
  const masteryRate=visible.length?Math.round(mastered/visible.length*100):0;
  const growth=growthStats(attempts);
  const feedbackStudents=new Set(feedback.map(studentKey).filter(Boolean)).size;
  const feedbackRate=participants.size?Math.round(feedbackStudents/participants.size*100):0;
  const clarity={clear:feedback.filter(x=>x.clarity==='clear').length,somewhat:feedback.filter(x=>x.clarity==='somewhat_confusing').length,confusing:feedback.filter(x=>x.clarity==='confusing').length};
  const breakdown=catalog.map(a=>{const all=attempts.filter(x=>x.activities?.slug===a.slug);const rows=viewRows(all,teacherAttemptView);const av=rows.length?Math.round(rows.reduce((q,x)=>q+x.score,0)/rows.length):0;const need=rows.filter(x=>x.mastery==='Developing'||x.mastery==='Needs Support').length;const students=new Set(all.map(studentKey).filter(Boolean)).size;return{...a,count:all.length,shown:rows.length,avg:av,need,students}});
  const viewLabel={latest:'Latest attempt',first:'First attempt',best:'Best attempt',all:'All attempts'}[teacherAttemptView];
  const signed=n=>`${n>0?'+':''}${n.toFixed(1)}`;
  const dryRunVerified=fullCompleters>=3&&attempts.length>=6;
  const readinessChecks=[['Class active',!!cur?.is_active],['Two CSS labs ready',catalog.length>=2],['Dry run verified',dryRunVerified],['Secure results captured',attempts.length>0],['Pilot analytics ready',true],['Evidence export ready',true]];
  const readinessDone=readinessChecks.filter(x=>x[1]).length,readinessPct=Math.round(readinessDone/readinessChecks.length*100),pilotReady=readinessDone===readinessChecks.length;

  T.innerHTML=`<div class="grid"><div class="row"><div><div class="ey">TEACHER WORKSPACE</div><h2>${cur?esc(cur.name):'Create your first class'}</h2><div class="muted">${esc(teacher.email)}</div></div><div class="toolbar"><button class="btn" id="refresh">Refresh</button><button class="btn" id="newclass">New class</button><button class="btn" id="logout">Sign out</button></div></div><div id="classform"></div>${classes.length>1?`<article class="card form"><label>Active class<select id="classpick">${classes.map(x=>`<option value="${x.id}" ${x.id===cur?.id?'selected':''}>${esc(x.name)} — ${esc(x.code)}</option>`).join('')}</select></label></article>`:''}${cur?`<article class="card"><div class="row"><div><div class="ey">CLASS ACCESS</div><h3 style="margin:5px 0">Code: ${esc(cur.code)} &nbsp; <span class="pill ${cur.is_active?'':'paused'}">${cur.is_active?'ACTIVE':'PAUSED'}</span></h3><div class="muted">Target: ${expected} students. ${cur.is_active?'Students can join now.':'New student sessions are blocked while paused.'}</div></div><div class="toolbar"><button class="btn" id="copycode">Copy code</button><button class="btn" id="classsettings">Class settings</button><button class="btn ${cur.is_active?'danger':''}" id="toggleclass">${cur.is_active?'Pause class':'Activate class'}</button><button class="btn primary" id="openstudent">Open Student Lab</button></div></div></article><article class="card"><div class="row"><div><div class="ey">CLASSROOM PILOT READINESS</div><h3 style="margin:5px 0" class="${pilotReady?'ok':'warn'}">${pilotReady?'READY FOR CLASSROOM PILOT':'PILOT PREPARATION IN PROGRESS'}</h3></div><b>${readinessPct}%</b></div><div class="mini-progress"><span style="width:${readinessPct}%"></span></div><div class="grid g3" style="margin-top:12px">${readinessChecks.map(x=>`<div><span class="${x[1]?'status-ok':'status-pending'}">${x[1]?'✓':'○'} ${esc(x[0])}</span></div>`).join('')}</div></article><div class="grid g4"><div class="card metric"><span class="muted">Participation</span><b>${participants.size}/${expected}</b><span class="muted">${participationRate}% tried at least one lab</span></div><div class="card metric"><span class="muted">Full completion</span><b>${fullCompleters}/${expected}</b><span class="muted">${fullCompletionRate}% finished all ${activeSlugs.length} active labs</span></div><div class="card metric"><span class="muted">Average score</span><b>${avg}%</b><span class="muted">${esc(viewLabel)}</span></div><div class="card metric"><span class="muted">Avg. time</span><b>${fmtDuration(avgDuration)}</b><span class="muted">Tracked attempts in view</span></div></div><article class="card"><div class="row"><div><div class="ey">PILOT EVIDENCE</div><h3 style="margin:5px 0">Ready-to-export class summary</h3></div><button class="btn primary" id="pilotreport">Download Pilot Report</button></div><div class="grid g4" style="margin-top:10px"><div class="metric"><span class="muted">Score change</span><b>${signed(growth.score)}</b><span class="muted">First → latest</span></div><div class="metric"><span class="muted">Efficiency change</span><b>${signed(growth.eff)} pts</b><span class="muted">Diagnostic process</span></div><div class="metric"><span class="muted">Steps reduced</span><b>${signed(growth.steps)}</b><span class="muted">Fewer is better</span></div><div class="metric"><span class="muted">Improved pairs</span><b>${growth.improved}/${growth.pairs}</b><span class="muted">Student × activity</span></div></div></article><article class="card"><div class="ey">STUDENT PROGRESS</div><h3>Who has finished all active labs?</h3>${roster.length?`<div class="table"><table><thead><tr><th>Student</th>${catalog.map(a=>`<th>${esc(a.short||a.title)}</th>`).join('')}<th>Status</th></tr></thead><tbody>${roster.map(r=>`<tr><td><b>${esc(r.name)}</b></td>${catalog.map(a=>`<td>${r.slugs.has(a.slug)?'<span class="ok">✓ Done</span>':'<span class="warn">Pending</span>'}</td>`).join('')}<td><b class="${r.complete?'ok':'warn'}">${r.complete?'Complete':'In progress'}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No participating students yet.</div>'}</article><article class="card"><div class="row"><div><div class="ey">STUDENT CLARITY FEEDBACK</div><h3 style="margin:5px 0">What confused students?</h3></div><span class="muted">${feedbackStudents}/${participants.size||0} participants responded (${feedbackRate}%)</span></div><div class="grid g3" style="margin-top:10px"><div class="metric"><span class="muted">Clear</span><b>${clarity.clear}</b></div><div class="metric"><span class="muted">Somewhat confusing</span><b>${clarity.somewhat}</b></div><div class="metric"><span class="muted">Confusing</span><b>${clarity.confusing}</b></div></div>${feedback.length?`<div class="table" style="margin-top:10px"><table><thead><tr><th>Student</th><th>Activity</th><th>Clarity</th><th>Note</th><th>Submitted</th></tr></thead><tbody>${feedback.map(x=>`<tr><td><b>${esc(x.student_name)}</b></td><td>${esc(x.activities?.title||'Activity')}</td><td>${esc(x.clarity.replaceAll('_',' '))}</td><td>${esc(x.note||'—')}</td><td>${new Date(x.created_at).toLocaleString('en-PH')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No clarity feedback yet. New completed student attempts now show the 10-second feedback prompt automatically.</p>'}</article><article class="card"><div class="row"><div><div class="ey">ACTIVITY ANALYTICS</div><h3 style="margin:5px 0">Retry-aware performance</h3></div><div class="toolbar"><select id="activityfilter"><option value="all">All activities</option>${catalog.map(a=>`<option value="${a.slug}" ${teacherActivityFilter===a.slug?'selected':''}>${esc(a.title)}</option>`).join('')}</select><select id="attemptview"><option value="latest" ${teacherAttemptView==='latest'?'selected':''}>Latest attempt</option><option value="first" ${teacherAttemptView==='first'?'selected':''}>First attempt</option><option value="best" ${teacherAttemptView==='best'?'selected':''}>Best attempt</option><option value   const showCreateForm=()=>{document.querySelector('#classform').innerHTML=`<form id="mk" class="card form"><label>Class name<input id="cn" value="Grade 12 - Computer Systems Servicing" required></label><label>Class code<input id="cc" value="CSS101" maxlength="8" required></label><label>Expected students<input id="ce" type="number" min="1" max="100" value="15" required></label><div id="cm" class="muted"></div><button class="btn primary">Save class</button></form>`;document.querySelector('#mk').onsubmit=async e=>{e.preventDefault();const name=document.querySelector('#cn').value.trim(),code=document.querySelector('#cc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8),expected_students=Number(document.querySelector('#ce').value);if(name.length<2||code.length<4||!Number.isInteger(expected_students)||expected_students<1||expected_students>100){document.querySelector('#cm').innerHTML='<span class="bad">Check the class name, 4–8 character code, and expected student count.</span>';return}const x=await sb.from('classes').insert({owner_id:teacher.id,name,code,expected_students}).select('id').single();if(x.error){document.querySelector('#cm').innerHTML='<span class="bad">'+esc(x.error.message)+'</span>';return}selectedClassId=x.data.id;teacherActivityFilter='all';teacherAttemptView='latest';renderTeacher()}};
  const showSettings=()=>{document.querySelector('#classform').innerHTML=`<form id="settings" class="card form"><div class="ey">CLASS SETTINGS</div><label>Class name<input id="snm" value="${esc(cur.name)}" required></label><label>Expected students<input id="sexp" type="number" min="1" max="100" value="${expected}" required></label><div id="sm" class="muted"></div><button class="btn primary">Save settings</button></form>`;document.querySelector('#settings').onsubmit=async e=>{e.preventDefault();const name=document.querySelector('#snm').value.trim(),expected_students=Number(document.querySelector('#sexp').value);if(name.length<2||!Number.isInteger(expected_students)||expected_students<1||expected_students>100){document.querySelector('#sm').innerHTML='<span class="bad">Enter a valid class name and student count.</span>';return}const x=await sb.from('classes').update({name,expected_students}).eq('id',cur.id);if(x.error){document.querySelector('#sm').innerHTML='<span class="bad">'+esc(x.error.message)+'</span>';return}renderTeacher()}};
  document.querySelector('#newclass').onclick=showCreateForm;const fc=document.querySelector('#firstclass');if(fc)fc.onclick=showCreateForm;document.querySelector('#refresh').onclick=()=>renderTeacher();document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();selectedClassId=null;teacherActivityFilter='all';teacherAttemptView='latest';renderTeacher()};const pick=document.querySelector('#classpick');if(pick)pick.onchange=e=>{selectedClassId=e.target.value;teacherActivityFilter='all';teacherAttemptView='latest';renderTeacher()};const af=document.querySelector('#activityfilter');if(af)af.onchange=e=>{teacherActivityFilter=e.target.value;renderTeacher()};const av=document.querySelector('#attemptview');if(av)av.onchange=e=>{teacherAttemptView=e.target.value;renderTeacher()};const copy=document.querySelector('#copycode');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(cur.code);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy code',1200)}catch{prompt('Copy class code:',cur.code)}};const cs=document.querySelector('#classsettings');if(cs)cs.onclick=showSettings;const tc=document.querySelector('#toggleclass');if(tc)tc.onclick=async()=>{tc.disabled=true;const x=await sb.from('classes').update({is_active:!cur.is_active}).eq('id',cur.id);if(x.error){alert(x.error.message);tc.disabled=false;return}renderTeacher()};const os=document.querySelector('#openstudent');if(os)os.onclick=()=>setTab('student');const ex=document.querySelector('#exportcsv');if(ex)ex.onclick=()=>{const rows=[['View','Student','Activity','Score','Mastery','Efficiency','Steps','Duration Seconds','Submitted'],...visible.map(x=>[viewLabel,x.student_name,x.activities?.title||'Activity',x.score,x.mastery,x.efficiency,x.steps_count??0,x.duration_seconds??'',new Date(x.created_at).toLocaleString('en-PH')])];const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`skilllab-${cur.code}-${teacherActivityFilter}-${teacherAttemptView}-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
  const pr=document.querySelector('#pilotreport');if(pr)pr.onclick=()=>{const report=`<!doctype html><html><head><meta charset="utf-8"><title>SkillLab PH Pilot Report - ${esc(cur.code)}</title><style>body{font:14px Arial,sans-serif;max-width:980px;margin:40px auto;color:#17202a}h1{margin-bottom:4px}.muted{color:#667}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #ccd3da;padding:8px;text-align:left}th{background:#eef3f6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{border:1px solid #ccd3da;border-radius:8px;padding:12px}.box b{font-size:22px;display:block}@media print{body{margin:16px}}</style></head><body><h1>SkillLab PH Classroom Pilot Evidence Report</h1><p class="muted">${esc(cur.name)} · Class code ${esc(cur.code)} · Generated ${new Date().toLocaleString('en-PH')}</p><div class="grid"><div class="box">Participation<b>${participants.size}/${expected}</b>${participationRate}%</div><div class="box">Full completion<b>${fullCompleters}/${expected}</b>${fullCompletionRate}%</div><div class="box">Average score<b>${avg}%</b>${esc(viewLabel)}</div><div class="box">Average time<b>${fmtDuration(avgDuration)}</b>Tracked view</div></div><h2>Learning Change</h2><div class="grid"><div class="box">Score change<b>${signed(growth.score)}</b></div><div class="box">Efficiency change<b>${signed(growth.eff)} pts</b></div><div class="box">Steps reduced<b>${signed(growth.steps)}</b></div><div class="box">Improved pairs<b>${growth.improved}/${growth.pairs}</b></div></div><h2>Activity Summary</h2><table><tr><th>Activity</th><th>Students</th><th>Attempts</th><th>${esc(viewLabel)} avg.</th><th>Need support</th></tr>${breakdown.map(b=>`<tr><td>${esc(b.title)}</td><td>${b.students}/${expected}</td><td>${b.count}</td><td>${b.avg}%</td><td>${b.need}</td></tr>`).join('')}</table><h2>Student Completion</h2><table><tr><th>Student</th>${catalog.map(a=>`<th>${esc(a.short||a.title)}</th>`).join('')}<th>Status</th></tr>${roster.map(r=>`<tr><td>${esc(r.name)}</td>${catalog.map(a=>`<td>${r.slugs.has(a.slug)?'Done':'Pending'}</td>`).join('')}<td>${r.complete?'Complete':'In progress'}</td></tr>`).join('')}</table><h2>Clarity Feedback</h2><p>Responses: ${feedbackStudents}/${participants.size||0} participants (${feedbackRate}%). Clear: ${clarity.clear}; Somewhat confusing: ${clarity.somewhat}; Confusing: ${clarity.confusing}.</p>${feedback.length?`<table><tr><th>Student</th><th>Activity</th><th>Clarity</th><th>Note</th></tr>${feedback.map(x=>`<tr><td>${esc(x.student_name)}</td><td>${esc(x.activities?.title||'Activity')}</td><td>${esc(x.clarity.replaceAll('_',' '))}</td><td>${esc(x.note||'—')}</td></tr>`).join('')}</table>`:'<p>No feedback responses recorded yet.</p>'}<h2>Interpretation</h2><p>${participants.size} student(s) participated; ${fullCompleters} completed every active simulator. First-to-latest attempts show ${signed(growth.score)} score points, ${signed(growth.eff)} efficiency points, and ${signed(growth.steps)} fewer steps on average. These figures should be interpreted as pilot evidence, not a causal learning-effect claim.</p></body></html>`;const blob=new Blob([report],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`skilllab-pilot-report-${cur.code}-${new Date().toISOString().slice(0,10)}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

async function startAttempt(name,code,slug){const x=await api({action:'join',student_name:name,class_code:code,activity_slug:slug});if(x.error)return x;sess=x;studentName=name;studentCode=code;selectedActivitySlug=slug;seen=[];logs=[x.intro||'Troubleshooting case started.'];diag='';repair='';result=null;feedbackDone=false;return x}

async function renderStudent(){
  await ensureCatalog();
  if(!sess){S.innerHTML=`<div class="grid"><article class="card hero"><div class="ey">STUDENT LAB</div><h1>Choose a troubleshooting activity.</h1><p class="muted">Enter your name and class code, then practice a real diagnostic sequence. Your teacher receives the score, mastery level, diagnostic efficiency, completion time, and your optional clarity feedback.</p></article><div class="grid g2">${catalog.map((a,i)=>`<div class="activity-card ${selectedActivitySlug===a.slug?'selected':''}" data-pick="${a.slug}"><div class="ey">SIMULATOR ${String(i+1).padStart(3,'0')}</div><h3>${esc(a.title)}</h3><p>${esc(a.intro||'')}</p><small>${esc(a.competency||'')}</small></div>`).join('')}</div><form id="join" class="card form"><div class="notice"><b>Selected:</b> <span id="selectedname">${esc(catalog.find(a=>a.slug===selectedActivitySlug)?.title||'Activity')}</span></div><label>Student name<input id="sn" maxlength="80" required></label><label>Class code<input id="sc" maxlength="8" required></label><div id="joinmsg" class="muted"></div><button class="btn primary">Start activity</button></form></div>`;document.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{selectedActivitySlug=c.dataset.pick;document.querySelectorAll('[data-pick]').forEach(x=>x.classList.toggle('selected',x.dataset.pick===selectedActivitySlug));document.querySelector('#selectedname').textContent=catalog.find(a=>a.slug===selectedActivitySlug)?.title||'Activity'});document.querySelector('#join').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#joinmsg'),name=document.querySelector('#sn').value.trim(),code=document.querySelector('#sc').value.trim().toUpperCase();m.innerHTML='<span class="spin"></span>Starting…';const x=await startAttempt(name,code,selectedActivitySlug);if(x.error){m.innerHTML='<span class="bad">'+esc(x.error)+'</span>';return}renderStudent()};return}

  const eff=Math.max(55,100-Math.max(0,seen.length-2)*8);
  const opts=sess.options||[];const actions=sess.actions||[];
  S.innerHTML=`<div class="grid"><div class="row"><div><div class="ey">ACTIVE SIMULATOR</div><h2>${esc(sess.activity_title)}</h2><div class="muted">${esc(sess.class_name)}</div></div><button class="btn" id="exitlab">Exit</button></div><div class="grid g2"><article class="card"><div class="row"><b>Virtual Workbench</b><span>Efficiency <b>${eff}%</b></span></div><div class="scene"><div class="screen ${result&&result.score>=80?'fixed':''}">${result&&result.score>=80?'ISSUE RESOLVED':(sess.activity_slug==='pc-no-boot-002'?'NO BOOT DEVICE':'NO SIGNAL')}</div><div class="tower">◉</div></div><div class="notice">${esc(sess.intro||'')}</div><h3>Diagnostic actions</h3><div class="acts">${actions.map(x=>`<button data-act="${x[0]}" class="${seen.includes(x[0])?'used':''}" ${seen.includes(x[0])||result?'disabled':''}>${seen.includes(x[0])?'✓ ':''}${esc(x[1])}</button>`).join('')}</div><div class="log"><div class="ey">OBSERVATION LOG</div>${logs.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}</div></article><aside class="grid"><article class="card form"><label>Diagnosis<select id="dg" ${result?'disabled':''}><option value="">Select diagnosis</option>${opts.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label><label>Repair<select id="rp" ${result?'disabled':''}><option value="">Select repair</option>${opts.map(x=>`<option value="${x[0]}">${esc(x[2])}</option>`).join('')}</select></label>${!result?'<button class="btn primary" id="submitcase">Complete troubleshooting</button>':''}</article>${result?`<article class="card"><div class="ey ok">RESULT SAVED</div><div class="score">${result.score}/100</div><h3>${esc(result.mastery)}</h3><p>Actual fault: <b>${esc(result.actual_fault)}</b></p><p class="muted">Recommended repair: ${esc(result.repair)}<br>Diagnostic efficiency: ${result.efficiency}%<br>Time: ${fmtDuration(result.duration_seconds)}</p><button class="btn" id="again">New randomized case</button></article>${feedbackDone?`<article class="card"><div class="ey ok">FEEDBACK SAVED</div><h3>Thank you.</h3><p class="muted">Your response helps improve this simulator before wider rollout.</p></article>`:`<article class="card form"><div class="ey">10-SECOND FEEDBACK</div><h3 style="margin:4px 0">How clear was this activity?</h3><div class="feedback-buttons"><button type="button" class="btn" data-feedback="clear">Clear</button><button type="button" class="btn" data-feedback="somewhat_confusing">Somewhat confusing</button><button type="button" class="btn" data-feedback="confusing">Confusing</button></div><label>Optional note<textarea id="feedbacknote" maxlength="500" placeholder="What part was confusing?"></textarea></label><div id="feedbackmsg" class="muted"></div></article>`}`:''}</aside></div></div>`;
  document.querySelector('#dg').value=diag;document.querySelector('#rp').value=repair;document.querySelector('#dg').onchange=e=>diag=e.target.value;document.querySelector('#rp').onchange=e=>repair=e.target.value;document.querySelector('#exitlab').onclick=()=>{sess=null;seen=[];logs=[];result=null;feedbackDone=false;renderStudent()};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const k=b.dataset.act;if(seen.includes(k))return;b.disabled=true;const x=await api({action:'inspect',session_id:sess.session_id,inspect:k});if(x.error){alert(x.error);return}seen.push(k);logs.push(x.clue);renderStudent()});const sub=document.querySelector('#submitcase');if(sub)sub.onclick=async()=>{if(!diag||!repair){alert('Choose a diagnosis and repair.');return}sub.disabled=true;sub.innerHTML='<span class="spin"></span>Saving…';const x=await api({action:'submit',session_id:sess.session_id,diagnosis:diag,repair});if(x.error){alert(x.error);sub.disabled=false;sub.textContent='Complete troubleshooting';return}result=x;renderStudent()};const ag=document.querySelector('#again');if(ag)ag.onclick=async()=>{const x=await startAttempt(studentName,studentCode,selectedActivitySlug);if(x.error){alert(x.error);sess=null;renderStudent();return}renderStudent()};document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=async()=>{if(!result?.attempt_id||feedbackDone)return;document.querySelectorAll('[data-feedback]').forEach(x=>x.disabled=true);const m=document.querySelector('#feedbackmsg');m.innerHTML='<span class="spin"></span>Saving feedback…';const x=await api({action:'feedback',attempt_id:result.attempt_id,clarity:b.dataset.feedback,note:document.querySelector('#feedbacknote')?.value||''});if(x.error){m.innerHTML='<span class="bad">'+esc(x.error)+'</span>';document.querySelectorAll('[data-feedback]').forEach(x=>x.disabled=false);return}feedbackDone=true;renderStudent()})
}
